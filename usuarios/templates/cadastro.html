{% load static %}
<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Cadastro | AdoteUmPet</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">

        <link href="{% static 'css/base.css' %}" rel="stylesheet">
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
    </head>
    <body>
        <div class="auth-card">
            <div class="form-section">
                <h2>Cadastre-se</h2>
                <p>Seu cadastro salva vidas.</p>

                {% for message in messages %}
                    <div class="alert {{ message.tags }}">{{message}}</div>
                {% endfor %}

                <form action="{% url 'cadastro' %}" method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome de Usuário:</label>
                        <input type="text" class="form-control" name="nome" id="nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail:</label>
                        <input type="email" class="form-control" name="email" id="email" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="senha" class="form-label">Senha:</label>
                            <input type="password" class="form-control" name="senha" id="senha" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="confirmar_senha" class="form-label">Confirmar senha:</label>
                            <input type="password" class="form-control" name="confirmar_senha" id="confirmar_senha" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-custom-accent w-100">Salvar</button>
                </form>
                
                <a href="{% url 'login' %}" class="link-auth">Já tenho uma conta? Faça o login</a>
            </div>

            <div class="branding-section">
                <img src="{% static 'img/logo_adote.png' %}">
                <h1>AdoteUmPet</h1>
                <p>Nos ajude a salvar vidas.</p>
            </div>
        </div>
    </body>
</html>
